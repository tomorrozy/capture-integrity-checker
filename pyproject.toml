[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-integrity-checker"
version = "0.1.0.dev0"
description = "Pluggable capture-path integrity layer that detects spoofed virtual cameras before face liveness detection (defense-in-depth baseline)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "The CaptureIntegrityChecker Authors" }]
dependencies = []

[project.optional-dependencies]
opencv = ["opencv-python>=4.8"]
windows = ["pywin32>=306; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'"]
dev = ["pytest>=7"]

[project.scripts]
capture-integrity-demo = "capture_integrity.demo:main"

[tool.setuptools]
packages = ["capture_integrity"]

[tool.pytest.ini_options]
testpaths = ["tests"]